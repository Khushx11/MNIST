name: Held-out MNIST reliability study

on:
  push:
    branches: [main]
    paths:
      - 'src/reliability.py'
      - 'scripts/run_reliability_study.py'
      - '.github/workflows/reliability-evaluation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install experiment dependencies
        run: python -m pip install -r requirements.txt
      - name: Evaluate on clean and corrupted held-out MNIST
        run: python scripts/run_reliability_study.py --output results/reliability_metrics.json
      - name: Preserve measured evaluation record
        uses: actions/upload-artifact@v4
        with:
          name: mnist-reliability-research-results
          path: results/reliability_metrics.json
          retention-days: 90
