name: Source, notebook and unit tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install project and testing packages
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest==8.3.2
      - name: Compile Python source
        run: python -m compileall -q src scripts
      - name: Validate notebook format
        run: python -m json.tool notebooks/analysis.ipynb > /dev/null
      - name: Run reliability regression tests
        run: python -m pytest tests -q
