<svg xmlns="http://www.w3.org/2000/svg" width="680" height="265" viewBox="0 0 680 265" role="img" aria-labelledby="title desc">
<title id="title">Central occlusion effects on MNIST digits 1 and 7</title><desc id="desc">Clean classification error 0.74% and central occlusion error 3.10%, calculated as 100% minus accuracy. Expected calibration error rises from 0.0055 to 0.0702.</desc>
<rect width="680" height="265" rx="14" fill="#f8fafc"/>
<g font-family="system-ui,sans-serif" fill="#182c40" font-size="14">
<text x="25" y="32" font-weight="700" font-size="22">Central occlusion changes accuracy and calibration</text>
<text x="25" y="55" fill="#42566c">Official held-out MNIST test · digits 1 and 7 · 2,163 images</text>
<text x="48" y="88" font-weight="700">Classification error</text><path d="M76 104V204H312" fill="none" stroke="#c5d2de"/><text x="68" y="109" text-anchor="end">4%</text><text x="68" y="208" text-anchor="end">0</text><path d="M126 185.5L248 126.5" stroke="#75509a" stroke-width="3"/><circle cx="126" cy="185.5" r="5" fill="#75509a"/><circle cx="248" cy="126.5" r="5" fill="#75509a"/><text x="126" y="174.5" text-anchor="middle">0.74%</text><text x="257" y="130.5">3.10%</text><text x="126" y="231" text-anchor="middle">Clean</text><text x="248" y="231" text-anchor="middle">Occluded</text>
<text x="374" y="88" font-weight="700">Expected calibration error</text><path d="M402 104V204H638" fill="none" stroke="#c5d2de"/><text x="394" y="109" text-anchor="end">0.08</text><text x="394" y="208" text-anchor="end">0</text><path d="M452 197.125L574 116.25" stroke="#75509a" stroke-width="3"/><circle cx="452" cy="197.125" r="5" fill="#75509a"/><circle cx="574" cy="116.25" r="5" fill="#75509a"/><text x="452" y="186.125" text-anchor="middle">0.0055</text><text x="583" y="120.25">0.0702</text><text x="452" y="231" text-anchor="middle">Clean</text><text x="574" y="231" text-anchor="middle">Occluded</text>
</g></svg>
